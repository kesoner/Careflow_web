<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" fill="none" role="img" aria-labelledby="title desc"><title id="title">Scenario comparison trajectories</title><desc id="desc">Original line drawing comparing three illustrative cost trajectories, with a fund timeline and no numeric claims.</desc><defs><style>.line{stroke:#E5E5DF;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.fine{stroke:#D6E0C3;stroke-width:1.8;opacity:.55}.strong{stroke:#F0EFE5;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#D0DA83;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.muted{opacity:.32}.label{fill:#D6E0C3;font:11px Arial,sans-serif;letter-spacing:2px;stroke:none}.dot{fill:#D0DA83;stroke:none}</style><g id="cross" class="fine"><path d="M-7 0H7M0-7V7"/><circle r="2"/></g><g id="connector" class="line"><circle r="5"/><circle r="13" opacity=".35"/></g></defs>
